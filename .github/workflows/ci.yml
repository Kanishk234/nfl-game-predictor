name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      # The gate. Runs on every commit, not just those touching the feature pipeline —
      # cheap enough that narrowing it would only create a way to skip it by accident.
      - run: pytest -m leakage
