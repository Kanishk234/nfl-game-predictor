name: predict-late

# Late pass — a fresher pass covering the Sunday/Monday slate, retrained with Thursday's (and
# any Saturday) results already in the training data.
#
# UTC conversion (see predict-early.yml for why one fixed UTC time must cover EDT and EST):
#   Sunday early slate  1:00 PM ET  =  17:00 UTC (EDT) / 18:00 UTC (EST)
#   We run              14:00 UTC Sun  =  10:00 AM EDT / 9:00 AM EST
# Three hours of slack in the tighter (EDT) case, because scheduled runs on free runners get
# delayed under load and a delayed run breaks the gate, not merely the schedule.
#
# This pass covers only games that have not yet kicked off. Games already played earlier in the
# week keep their early-pass prediction, which is immutable. The grader's "official" rule picks
# the latest pass generated before each game's kickoff, so this one wins for Sun/Mon games.
#
# Re-running for a week that is already published is a clean no-op, not a failure.

on:
  schedule:
    - cron: "0 14 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so `git pull --rebase` cannot trip on a shallow clone
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: predict (late pass)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m nfl_predict.predict --pass late
      # Commits the data, rebases, rebuilds the site on top, and pushes with retries.
      # See tools/publish.sh for why the site is built after the rebase and not before.
      - name: publish
        run: tools/publish.sh "data/predictions data/odds"

  deploy:
    needs: predict
    uses: ./.github/workflows/deploy-site.yml
    permissions:
      contents: read
      pages: write
      id-token: write
