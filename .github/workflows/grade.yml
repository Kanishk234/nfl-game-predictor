name: grade

# Grading — pulls final scores, updates results + season history, rebuilds the site. Runs on
# three days so cards update as the week's games finish, not only on Tuesday:
#
#   Fri  after Thursday night        (first slot 12:19 UTC = 8:19 AM EDT / 7:19 AM EST)
#   Mon  after the Sunday slate
#   Tue  after Monday night          -> the week is complete
#
# Three attempts per day, none on the hour. The 2026-09-14 Mon 12:00 slot was dropped outright
# and the 2026-09-11 Fri 12:00 slot started at 15:18 (+3h18m); GitHub sheds scheduled runs at
# :00 under load. Grading is the mildest of the three failure modes — it is idempotent, rewrites
# result files from facts, and a missed day is picked up by the next slot, so nothing is lost
# permanently. It is staggered anyway for a second reason: the health check runs as a step of
# this job (see below), so a dropped grade run also drops the only alarm watching the record.
#
# Monday Night Football ends ~11:30 PM ET = ~03:30 UTC Tue (EDT) / ~04:30 UTC Tue (EST); noon
# UTC leaves hours for the box scores to settle upstream. The model itself retrains at every
# prediction pass on all completed games, so Thursday's pass already includes the whole previous
# week; there is no separate "train on Tuesday" step to schedule.
#
# Safe to dispatch by hand at any time: grading only reads predictions and rewrites result files
# from facts, and a week with no completed games writes nothing.

on:
  schedule:
    - cron: "19 12 * * 5"   # Friday, after Thursday night
    - cron: "41 13 * * 5"
    - cron: "7 15 * * 5"
    - cron: "19 12 * * 1"   # Monday, after the Sunday slate
    - cron: "41 13 * * 1"
    - cron: "7 15 * * 1"
    - cron: "19 12 * * 2"   # Tuesday, after Monday night
    - cron: "41 13 * * 2"
    - cron: "7 15 * * 2"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so `git pull --rebase` cannot trip on a shallow clone
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: python -m nfl_predict.grade
      # Commits the data, rebases, rebuilds the site on top, and pushes with retries.
      # See tools/publish.sh for why the site is built after the rebase and not before.
      - name: publish
        run: bash tools/publish.sh "data/results"

      # Last, and allowed to fail the job: nobody is watching an unattended season, so a hole in
      # the record has to announce itself. A red job sends GitHub's failure email.
      - name: check the record for holes
        run: python -m nfl_predict.health

  deploy:
    needs: grade
    uses: ./.github/workflows/deploy-site.yml
    permissions:
      contents: read
      pages: write
      id-token: write
