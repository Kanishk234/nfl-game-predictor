name: grade

# Grading — pulls final scores, updates results + season history, rebuilds the site. Runs three
# times a week so cards update as the week's games finish, not only on Tuesday:
#
#   Fri 12:00 UTC  after Thursday night        (8 AM EDT / 7 AM EST)
#   Mon 12:00 UTC  after the Sunday slate
#   Tue 12:00 UTC  after Monday night          -> the week is complete
#
# Monday Night Football ends ~11:30 PM ET = ~03:30 UTC Tue (EDT) / ~04:30 UTC Tue (EST); noon
# UTC leaves hours for the box scores to settle upstream. The model itself retrains at every
# prediction pass on all completed games, so Thursday's pass already includes the whole previous
# week; there is no separate "train on Tuesday" step to schedule.
#
# Safe to dispatch by hand at any time: grading only reads predictions and rewrites result files
# from facts, and a week with no completed games writes nothing.

on:
  schedule:
    - cron: "0 12 * * 5"
    - cron: "0 12 * * 1"
    - cron: "0 12 * * 2"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so `git pull --rebase` cannot trip on a shallow clone
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: python -m nfl_predict.grade
      - run: python -m nfl_predict.site_build
      - name: commit and push results and the rebuilt site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results site
          if git diff --cached --quiet; then echo "no new results"; exit 0; fi
          git commit -m "grade $(date -u +%Y-%m-%d) results"
          git pull --rebase origin main
          git push origin HEAD:main

  deploy:
    needs: grade
    uses: ./.github/workflows/deploy-site.yml
    permissions:
      contents: read
      pages: write
      id-token: write
