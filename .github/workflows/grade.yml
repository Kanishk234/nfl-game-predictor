name: grade

# Post-weekend grading pass — pulls final scores and updates the results + season history.
#
# UTC conversion: Monday Night Football ends around 11:30 PM ET, i.e. ~03:30 UTC Tue (EDT) or
# ~04:30 UTC Tue (EST). We run 12:00 UTC Tue (8:00 AM EDT / 7:00 AM EST), well after the last
# game of the week has finished and after the box scores have settled upstream — and four hours
# before predict-early, so the new week's model trains on a fully graded previous week.
#
# Safe to dispatch by hand at any time: grading only reads predictions and rewrites result files
# from facts, and a week with no completed games writes nothing.

on:
  schedule:
    - cron: "0 12 * * 2"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so `git pull --rebase` cannot trip on a shallow clone
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: python -m nfl_predict.grade
      - name: commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results
          if git diff --cached --quiet; then echo "no new results"; exit 0; fi
          git commit -m "grade $(date -u +%Y-%m-%d) results"
          git pull --rebase origin main
          git push origin HEAD:main

  deploy:
    needs: grade
    uses: ./.github/workflows/deploy-site.yml
    permissions:
      contents: read
      pages: write
      id-token: write
