name: predict-sun

# Sunday pass — a fresher pass covering the Sunday/Monday slate.
#
# UTC conversion (see predict-thu.yml for why one fixed UTC time must cover both EDT and EST):
#   Early slate  1:00 PM ET  =  17:00 UTC during EDT (UTC-4)
#                           =  18:00 UTC during EST (UTC-5)
#   We run       14:00 UTC Sun  =  10:00 AM EDT / 9:00 AM EST
# Three hours of slack in the tighter (EDT) case, for the same delayed-runner reason.

on:
  schedule:
    - cron: "0 14 * * 0"
  workflow_dispatch:

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: placeholder
        run: echo "Phase 0 scaffold — prediction logic lands in Phase 4 (see docs/PLAN.md)"
