name: predict-early

# Early pass — the frozen official prediction for the whole upcoming week, including whichever
# game opens it.
#
# This runs TUESDAY, not Thursday. The original Thursday schedule assumed the week always opens
# with Thursday Night Football. It does not: since 2002 there have been 136 Saturday, 13 Friday,
# 6 Wednesday and 5 Tuesday regular-season games, and 2026 Week 1 opens on WEDNESDAY Sept 9.
# A Thursday run would have published that week's prediction ~21 hours after kickoff.
#
# UTC conversion (Actions cron is UTC and has no DST awareness, so one time must be safe in both
# EDT (UTC-4) and EST (UTC-5)):
#   We run           16:00 UTC Tue  =  12:00 PM EDT / 11:00 AM EST
#   Earliest opener  a Wednesday night game, ~8:20 PM ET  =  00:20 UTC Wed
# That leaves ~32h of slack, and it lands after Monday night's games have been graded.
#
# The cron is only the trigger. The gate is enforced in code: the pass computes the week's
# earliest kickoff and refuses to publish if it has already passed (see data/schedule.py).

on:
  schedule:
    - cron: "0 16 * * 2"
  workflow_dispatch:

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: placeholder
        run: echo "Phase 0 scaffold - prediction logic lands in Phase 4 (see docs/PLAN.md)"
