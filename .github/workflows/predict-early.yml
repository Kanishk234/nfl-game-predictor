name: predict-early

# Early pass — the frozen prediction for the week's Thursday-through-Saturday games (and
# Sunday/Monday too, until the late pass refreshes them).
#
# UTC conversion (Actions cron is UTC and has no DST awareness, so one fixed time must be safe
# in both EDT (UTC-4) and EST (UTC-5)):
#   We run           21:00 UTC Thu  =  5:00 PM EDT / 4:00 PM EST
#   TNF kickoff      8:15 PM ET     =  00:15 UTC Fri (EDT) / 01:15 UTC Fri (EST)
# That leaves 3h15m of slack in the tighter (EDT) case. Slack is deliberate: scheduled runs on
# free runners get delayed under load.
#
# The gate is per game, enforced in code: the pass predicts only games whose kickoff is still
# ahead and refuses to run once the whole week has started. A week that opens on Wednesday
# (2026 Week 1 did) keeps its Wednesday game out of this pass; that game needs a manual run
# beforehand, as Week 1's did.
#
# Re-running for a week that is already published is a clean no-op, not a failure.

on:
  schedule:
    - cron: "0 21 * * 4"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# One data-writing job at a time, so two passes can never race on a push.
concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so `git pull --rebase` cannot trip on a shallow clone
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: predict (early pass)
        env:
          # The only place the key exists in CI. It is masked in logs and never written to a
          # file; see odds/fetch.py for the scrubbing on the code side.
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m nfl_predict.predict --pass early
      - run: python -m nfl_predict.site_build
      - name: commit and push the frozen prediction + odds and the rebuilt site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/predictions data/odds site
          if git diff --cached --quiet; then echo "nothing new to publish"; exit 0; fi
          latest=$(git diff --cached --name-only -- data/predictions | head -1 | xargs -n1 basename | sed 's/\.json$//')
          git commit -m "publish ${latest} prediction"
          git pull --rebase origin main
          git push origin HEAD:main

  deploy:
    needs: predict
    uses: ./.github/workflows/deploy-site.yml
    permissions:
      contents: read
      pages: write
      id-token: write
